<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye of the System</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #16202b; --muted: #5d6b7a; --line: #d5dbe3;
  --formula: #2b4a6f; --hot: #c4402f; --hot-bg: #fbe9e6; --ok: #2d7a6b; --warn: #8a6a1f; --focus: #2b6fd6;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161c; --surface: #1a212a; --fg: #e8edf3; --muted: #98a6b5; --line: #323d4a;
          --formula: #8fb4e3; --hot: #ff7d6b; --hot-bg: #3a2020; --ok: #6fd0bd; --warn: #e0b868; --focus: #6fa6ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--ui); }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
h1 { font-size: 18px; margin: 0; }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill.open, .pill.ongoing { color: var(--hot); } .pill.resolved { color: var(--ok); } .pill.example { color: var(--warn); }
.pill.supported { color: var(--ok); } .pill.plausible { color: var(--warn); } .pill.rejected { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); align-items: center; }
.demo-tag { font-weight: 700; font-size: 12px; letter-spacing: .08em; color: var(--warn); border: 1px dashed var(--warn); border-radius: 6px; padding: 3px 9px; display: flex; flex-direction: column; line-height: 1.25; }
.demo-tag small { font-weight: 400; letter-spacing: 0; color: var(--muted); font-size: 11px; }
#demo-controls { background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(138,106,31,.06) 10px 20px); }
.controls .grp { display: flex; gap: 6px; align-items: center; padding-right: 14px; border-right: 1px solid var(--line); }
.controls .grp:last-child { border: 0; }
.controls label { color: var(--muted); font-size: 12px; }
select, button { font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
button { cursor: pointer; font-weight: 600; } button:hover { border-color: var(--fg); }
button:focus-visible, select:focus-visible, .inc:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#toast { margin-left: auto; color: var(--muted); font-size: 13px; min-height: 20px; }
main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(340px, 1fr); gap: 14px; padding: 14px 20px 30px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card h2 { font-size: 14px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: .02em; }
#graphwrap { overflow: auto; max-height: 82vh; padding: 8px; }
svg text { font-family: var(--ui); }
.node rect { fill: var(--surface); stroke: var(--formula); stroke-width: 1.3; }
.node.repeated rect { stroke-dasharray: 4 3; opacity: .85; }
.node text { fill: var(--fg); font-size: 13px; text-anchor: middle; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.dim .node, .dim .edge { opacity: .3; }
.dim .node.on, .dim .edge.on { opacity: 1; }
.dim .edge.on { stroke: var(--hot); stroke-width: 2.2; }
.node.hot rect { stroke: var(--hot); fill: var(--hot-bg); stroke-width: 2.2; }
.node.on:not(.hot) rect { stroke-width: 2.2; }
#side { display: grid; gap: 14px; }
#feed { max-height: 220px; overflow: auto; }
.inc { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.inc:last-child { border: 0; } .inc.sel { background: var(--hot-bg); }
.inc .t { font-weight: 600; } .inc .m { color: var(--muted); font-size: 12px; }
.detail { padding: 12px 14px; display: grid; gap: 12px; }
.detail h3 { margin: 0 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--hot); }
.hyp { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.hyp ul, ol { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.empty { padding: 18px 14px; color: var(--muted); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Eye of the System</h1>
  <span class="clock" id="clock">connecting...</span>
  <span id="exbadge"></span>
</header>
<div class="controls" id="demo-controls">
  <div class="demo-tag" title="These buttons write simulated faults into the simulator. The monitor cannot see them; it has to find them in the data.">DEMO<small>simulated faults, not part of the monitor</small></div>
  <div class="grp"><label>Fault</label>
    <select id="pf-country"></select><select id="pf-platform"></select>
    <button id="pf-go">Payment failure</button></div>
  <div class="grp"><label>Innocent change</label>
    <select id="pr-country"></select><button id="pr-go">Promo (12 h)</button></div>
  <div class="grp"><label>Data</label>
    <select id="dd-source"></select><button id="dd-go">Arrives 2 h late</button></div>
  <div class="grp"><label>New metric</label><button id="nm-go">Add refund_rate</button></div>
  <div id="toast" role="status"></div>
</div>
<main>
  <section class="card"><h2>Metric graph (formula tree from the top outcome)</h2><div id="graphwrap"><svg id="g"></svg></div></section>
  <aside id="side">
    <section class="card"><h2>Incidents</h2><div id="feed"></div></section>
    <section class="card"><h2>Report</h2><div id="detail" class="detail"><div class="empty">Select an incident.</div></div></section>
  </aside>
</main>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var graph = null, incidents = [], example = false, selected = null, lastState = null;

  function text(s) { return document.createTextNode(s == null ? '' : String(s)); }
  function el(tag, cls, kids) {
    var e = document.createElement(tag); if (cls) e.className = cls;
    (kids || []).forEach(function (k) { e.appendChild(typeof k === 'string' ? text(k) : k); });
    return e;
  }
  function get(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); });
  }
  function toast(msg) { $('toast').textContent = msg; }

  // ---------------------------------------------------------------- graph
  function layout(root) {
    var nodes = [], edges = [], leaf = 0, DX = 180, DY = 36;
    (function walk(n, depth, parent) {
      var item = { n: n, x: depth * DX + 80, y: 0 };
      var childYs = [];
      (n.children || []).forEach(function (c) { childYs.push(walk(c, depth + 1, item).y); });
      item.y = childYs.length ? (Math.min.apply(null, childYs) + Math.max.apply(null, childYs)) / 2 : (leaf++) * DY + 24;
      nodes.push(item);
      if (parent) edges.push([parent, item]);
      return item;
    })(root, 0, null);
    return { nodes: nodes, edges: edges, w: Math.max.apply(null, nodes.map(function (i) { return i.x; })) + 90, h: leaf * DY + 30 };
  }
  function svg(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  var drawn = null;
  function drawGraph() {
    if (!graph || !graph.trees || !graph.trees.length) return;
    var L = layout(graph.trees[0]), g = $('g');
    g.setAttribute('viewBox', '0 0 ' + L.w + ' ' + L.h);
    g.style.width = '100%'; g.style.height = 'auto';
    g.textContent = '';
    var ge = svg('g', {}, g), gn = svg('g', {}, g);
    drawn = { edges: [], nodes: [] };
    L.edges.forEach(function (pair) {
      var a = pair[0], b = pair[1], x1 = a.x + 75, x2 = b.x - 75, c = (x2 - x1) / 2;
      var p = svg('path', { d: 'M' + x1 + ',' + a.y + ' C' + (x1 + c) + ',' + a.y + ' ' + (x2 - c) + ',' + b.y + ' ' + x2 + ',' + b.y, 'class': 'edge' }, ge);
      drawn.edges.push({ el: p, from: a.n.metric, to: b.n.metric });
    });
    L.nodes.forEach(function (i) {
      var gr = svg('g', { 'class': 'node' + (i.n.repeated ? ' repeated' : ''), transform: 'translate(' + (i.x - 75) + ',' + (i.y - 13) + ')' }, gn);
      svg('rect', { width: 150, height: 26, rx: 6 }, gr);
      var t = svg('text', { x: 75, y: 17 }, gr); t.textContent = i.n.metric;
      var title = svg('title', {}, gr); title.textContent = i.n.metric + (i.n.role ? ' (' + i.n.role + ')' : '');
      drawn.nodes.push({ el: gr, metric: i.n.metric });
    });
    highlight();
  }
  function highlight() {
    if (!drawn) return;
    var inc = incidents.filter(function (i) { return i.id === selected; })[0];
    var on = {}, hot = {};
    if (inc) {
      on[inc.metric] = true; hot[inc.metric] = true;
      var kids = {};
      drawn.edges.forEach(function (e) { (kids[e.from] = kids[e.from] || []).push(e.to); });
      var path = function (from, target, seen) {          // nodes on a route from `from` down to `target`
        if (from === target) return [from];
        if (seen[from]) return null; seen[from] = true;
        var ks = kids[from] || [];
        for (var k = 0; k < ks.length; k++) { var r = path(ks[k], target, seen); if (r) return [from].concat(r); }
        return null;
      };
      (inc.contributions || []).forEach(function (c) {
        on[c.node] = true; if ((c.share_of_delta || 0) > 0.5) hot[c.node] = true;
        (path(inc.metric, c.node, {}) || []).forEach(function (m) { on[m] = true; });
      });
    }
    var any = Object.keys(on).length > 0;
    $('g').classList.toggle('dim', any);
    drawn.nodes.forEach(function (n) { n.el.classList.toggle('on', !!on[n.metric]); n.el.classList.toggle('hot', !!hot[n.metric]); });
    drawn.edges.forEach(function (e) { e.el.classList.toggle('on', !!(on[e.from] && on[e.to])); });
  }

  // ------------------------------------------------------------ incidents
  function fmt(n, d) { return n == null ? '-' : Number(n).toLocaleString('en', { maximumFractionDigits: d == null ? 1 : d }); }
  function segText(s) { var k = Object.keys(s || {}); return k.length ? k.map(function (x) { return s[x]; }).join(' x ') : 'all'; }

  function renderFeed() {
    var f = $('feed'); f.textContent = '';
    if (!incidents.length) { f.appendChild(el('div', 'empty', ['No incidents yet. The brain is watching.'])); return; }
    incidents.forEach(function (i) {
      var row = el('div', 'inc' + (i.id === selected ? ' sel' : ''), [
        el('span', 'pill ' + (i.status || 'open'), [i.status || 'open']),
        el('span', null, [el('span', 't', [i.metric + ' ' + (i.change && i.change.delta_pct != null ? fmt(i.change.delta_pct) + '%' : '')]), el('div', 'm', [segText(i.segment) + ' | first seen ' + (i.first_seen || '')])]),
        el('span', 'm', [i.id])
      ]);
      row.tabIndex = 0;
      var pick = function () { selected = i.id; renderFeed(); renderDetail(); highlight(); };
      row.addEventListener('click', pick);
      row.addEventListener('keydown', function (e) { if (e.key === 'Enter') pick(); });
      f.appendChild(row);
    });
  }
  function section(title, kids) { var d = el('div', null, [el('h3', null, [title])]); kids.forEach(function (k) { d.appendChild(k); }); return d; }
  function renderDetail() {
    var d = $('detail'); d.textContent = '';
    var i = incidents.filter(function (x) { return x.id === selected; })[0];
    if (!i) { d.appendChild(el('div', 'empty', ['Select an incident.'])); return; }
    var kv = el('div', 'kv');
    var ch = i.change || {};
    [['Metric', i.metric], ['Segment', segText(i.segment)], ['Observed', fmt(ch.observed)], ['Expected', fmt(ch.expected)],
     ['Change', ch.delta_pct != null ? fmt(ch.delta_pct) + '% (z ' + fmt(ch.z) + ')' : '-']].forEach(function (p) { kv.appendChild(el('span', null, [p[0]])); kv.appendChild(el('span', null, [p[1]])); });
    d.appendChild(section('What changed', [kv]));
    var imp = i.impact || {}, ik = el('div', 'kv');
    Object.keys(imp).forEach(function (k) { ik.appendChild(el('span', null, [k])); ik.appendChild(el('span', null, [fmt(imp[k], 0)])); });
    if (Object.keys(imp).length) d.appendChild(section('Business impact', [ik]));
    var cs = (i.contributions || []).map(function (c) {
      var bar = el('div', 'bar'); var b = el('i'); b.style.width = Math.max(0, Math.min(100, (c.share_of_delta || 0) * 100)) + '%'; bar.appendChild(b);
      return el('div', null, [el('div', null, [c.node + ': ' + fmt((c.share_of_delta || 0) * 100, 0) + '% of the change (' + fmt(c.observed, 2) + ' vs ' + fmt(c.expected, 2) + ')']), bar]);
    });
    if (cs.length) d.appendChild(section('Where along the graph', cs));
    var hs = (i.hypotheses || []).map(function (h) {
      return el('div', 'hyp', [el('div', null, [el('span', 'pill ' + h.status, [h.status]), ' ' + h.cause]),
        el('ul', null, (h.evidence || []).map(function (e) { return el('li', null, [e]); }))]);
    });
    if (hs.length) d.appendChild(section('Hypotheses', hs));
    var tr = (i.trail || []).map(function (s) { return el('li', null, [s.action + ' ' + s.target + ': ' + s.result]); });
    if (tr.length) d.appendChild(section('Investigation trail', [el('ol', null, tr)]));
    if ((i.uncertain || []).length) d.appendChild(section('Still uncertain', [el('ul', null, i.uncertain.map(function (u) { return el('li', null, [u]); }))]));
    if (i.report) d.appendChild(section('Summary', [el('div', null, [i.report])]));
  }

  // ------------------------------------------------------------- polling
  function refresh() {
    get('/api/state').then(function (s) {
      lastState = s;
      if (!s.ready) { $('clock').textContent = s.error; return; }
      $('clock').textContent = 'simulated clock ' + s.last_hour.replace('T', ' ').replace(':00:00Z', ':00 UTC');
    }).catch(function () { $('clock').textContent = 'server not reachable'; });
    get('/api/incidents').then(function (r) {
      incidents = r.incidents; example = r.example;
      $('exbadge').textContent = '';
      if (example) $('exbadge').appendChild(el('span', 'pill example', ['showing the contract example, no live incident yet']));
      if (!selected && incidents.length) selected = incidents[0].id;
      renderFeed(); renderDetail(); highlight();
    }).catch(function () {});
  }

  // ------------------------------------------------------------- controls
  function fill(id, values) { var s = $(id); values.forEach(function (v) { var o = document.createElement('option'); o.value = v; o.textContent = v; s.appendChild(o); }); }
  fill('pf-country', ['DE', 'FR', 'ES', 'PL']); fill('pf-platform', ['Android', 'iOS', 'Web']);
  fill('pr-country', ['FR', 'DE', 'ES', 'PL']); fill('dd-source', ['payments', 'orders', 'traffic', 'search', 'recommendations', 'ads', 'inventory']);
  function act(body, label) {
    toast(label + '...');
    post('/api/inject', body).then(function (r) { toast(label + ' from ' + r.start.replace('T', ' ').replace(':00:00Z', ':00 UTC')); refresh(); })
      .catch(function (e) { toast('Failed: ' + e.message); });
  }
  $('pf-go').onclick = function () { act({ kind: 'payment_failure', country: $('pf-country').value, platform: $('pf-platform').value, severity: 0.4, when: 'now' }, 'Payment failure injected'); };
  $('pr-go').onclick = function () { act({ kind: 'promo', country: $('pr-country').value, hours: 12, when: 'now' }, 'Promo started'); };
  $('dd-go').onclick = function () { act({ kind: 'data_delay', source: $('dd-source').value, hours: 3, delay_hours: 2, when: 'now' }, 'Late data scheduled'); };
  $('nm-go').onclick = function () {
    var y = 'name: refund_rate\ndescription: Share of orders refunded\nformula: refunds / orders\nsql: >\n  SELECT ts, country, platform, category, channel,\n         SUM(refunds) * 1.0 / NULLIF(SUM(orders), 0) AS value\n  FROM facts_hourly GROUP BY ts, country, platform, category, channel\ndimensions: [country, platform, category, channel]\nunit: ratio\n';
    post('/api/metric', { yaml_text: y }).then(function (r) { toast('Metric handed to the brain: ' + r.saved); }).catch(function (e) { toast('Failed: ' + e.message); });
  };

  get('/api/graph').then(function (g) { graph = g; drawGraph(); }).catch(function (e) { $('graphwrap').textContent = 'Graph export missing: ' + e.message; });
  refresh(); setInterval(refresh, 2000);
})();
</script>
</body>
</html>
