<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye of the System</title>
<script>var t = new URLSearchParams(location.search).get('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;</script>
<link rel="stylesheet" href="/static/console.css">
<style>
/* the title and the domain selector stay at the top while the page scrolls */
.sticky-top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.sticky-top .top { padding: 16px 0 8px; }
/* domain selector: the main control */
#domains { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 16px; }
.chip { display: inline-flex; gap: 8px; align-items: baseline; padding: 8px 16px; }
.chip .n { color: var(--hot); font-weight: 700; }
.chip.on .n { color: var(--sel-fg); }
/* demo controls: folded, clearly marked */
#demo-controls { background: var(--block); border-radius: 8px; margin-bottom: 24px; }
#demo-controls summary { cursor: pointer; padding: 8px 16px; list-style: none; display: flex; gap: 16px; align-items: center; color: var(--muted); }
#demo-controls summary::-webkit-details-marker { display: none; }
.demo-tag { white-space: nowrap; font-size: 12px; font-weight: 700; letter-spacing: .08em; border: 1px solid var(--accent); border-radius: 4px; padding: 0 8px; color: var(--ink); }
.demo-tag small { font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 8px 16px 16px; align-items: center; }
.controls .grp { display: flex; gap: 8px; align-items: center; }
.controls label { color: var(--muted); font-size: 12px; }
.controls select, .controls button { background: var(--bg); }
#toast { margin-left: auto; color: var(--muted); min-height: 24px; }
/* layout */
main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 24px; padding-bottom: 48px; align-items: start; }
/* the graph stays in view while the long report on the right is read */
#graph-card { position: sticky; top: calc(var(--top-h, 120px) + 16px); display: flex; flex-direction: column; max-height: calc(100vh - var(--top-h, 120px) - 32px); }
#graphwrap { flex: 1 1 auto; min-height: 160px; overflow: auto; padding: 8px 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 0 24px; padding: 8px 24px 16px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; border: 1.5px solid; vertical-align: 0; }
#extra { padding: 0 24px 24px; color: var(--muted); font-size: 12px; }
#extra:empty { display: none; }
#extra button { margin: 8px 8px 0 0; padding: 0 8px; font-size: 12px; background: var(--bg); }
/* graph */
svg text { font-family: var(--ui); }
.node rect { fill: var(--bg); stroke: var(--edge); stroke-width: 1.2; }
.node text { fill: var(--ink); font-size: 13px; text-anchor: middle; }
.node.repeated rect { stroke-dasharray: 4 3; }
.node.context text { fill: var(--muted); } .node.context rect { stroke: var(--line); }
.node.h-open rect { stroke: var(--hot); fill: var(--hot-bg); stroke-width: 2; }
.node.h-ongoing rect { stroke: var(--amber); fill: var(--amber-bg); stroke-width: 2; }
.node.h-resolved rect { stroke: var(--ok); fill: var(--ok-bg); stroke-width: 1.6; }
.node.picked rect { stroke: var(--accent); stroke-width: 3; }
.node { cursor: pointer; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; }
.dim .node, .dim .edge { opacity: .35; } .dim .node.on, .dim .edge.on { opacity: 1; }
.dim .edge.on { stroke: var(--hot); stroke-width: 2; }
/* right side */
#side { display: grid; gap: 24px; }
#feed { max-height: 232px; overflow: auto; padding-bottom: 8px; }
.inc { display: grid; grid-template-columns: 56px 1fr auto; gap: 0 16px; padding: 8px 24px; cursor: pointer; align-items: baseline; }
.inc.sel { background: var(--hot-bg); }
.inc .t { font-weight: 500; } .inc .m { color: var(--muted); font-size: 12px; }
.detail { padding: 8px 24px 24px; display: grid; gap: 24px; }
.detail h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 4px 0 8px; } .bar i { display: block; height: 100%; background: var(--hot); }
.hyp { margin-bottom: 16px; } .hyp ul, ol { margin: 4px 0 0; padding-left: 24px; color: var(--muted); }
.detail .empty, #feed .empty { padding: 8px 0 16px; }
svg#g { min-width: 720px; }                       /* keep the boxes readable; the card scrolls sideways instead */
#demo-controls summary { white-space: nowrap; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } .page { padding: 0 16px; }
  #graph-card { position: static; max-height: none; } #graphwrap { max-height: 70vh; } }
@media (max-width: 600px) { .sticky-top { position: static; }   /* on a phone the chips would take too much of the screen */
  .demo-tag small { display: none; } #graphwrap { padding: 8px 16px; } }
</style>
</head>
<body>
<div class="page">
<div class="sticky-top">
  <header class="top">
    <h1>Eye of the System</h1>
    <span class="muted" id="clock">connecting...</span>
    <span id="exbadge"></span>
    <a class="grow" href="/data">Data &rarr;</a>
  </header>
  <nav id="domains" aria-label="Business domain"></nav>
</div>

<details id="demo-controls">
  <summary><span class="demo-tag" title="These buttons write simulated faults into the simulator. The monitor cannot see them; it has to find them in the data.">DEMO<small>simulated faults, not part of the monitor</small></span> controls &#9662;</summary>
  <div class="controls">
    <div class="grp"><label>Fault</label>
      <select id="f-kind"></select><select id="f-country"></select><select id="f-platform"></select><select id="f-category"></select>
      <button id="f-go">Inject fault</button></div>
    <div class="grp" id="end-grp" hidden><label>In progress</label>
      <select id="end-select"></select><button id="end-go">End it (rollback)</button></div>
    <div class="grp"><label>Innocent change</label>
      <select id="pr-country"></select><button id="pr-go">Promo (12 h)</button></div>
    <div class="grp"><label>Data</label>
      <select id="dd-source"></select><button id="dd-go">Arrives 2 h late</button></div>
    <div class="grp"><label>New metric</label><button id="nm-go">Add refund_rate</button></div>
    <div id="toast" role="status"></div>
  </div>
</details>

<main>
  <section class="card" id="graph-card">
    <h2 id="graph-title">Metric graph</h2>
    <div id="graphwrap"><svg id="g"></svg></div>
    <div class="legend" aria-hidden="true">
      <span><i style="border-color:var(--hot);background:var(--hot-bg)"></i>in an open incident</span>
      <span><i style="border-color:var(--amber);background:var(--amber-bg)"></i>ongoing</span>
      <span><i style="border-color:var(--ok);background:var(--ok-bg)"></i>resolved</span>
      <span><i style="border-color:var(--edge)"></i>no incident</span>
      <span>dashed: shown again under another parent. Click a box for details.</span>
    </div>
    <div id="extra"></div>
  </section>
  <aside id="side">
    <section class="card"><h2 id="feed-title">Incidents</h2><div id="feed"></div></section>
    <section class="card"><h2 id="detail-title">Details</h2><div id="detail" class="detail"><div class="empty">Select a box in the graph or an incident.</div></div></section>
  </aside>
</main>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var graph = null, meta = {}, domains = [], domOf = {}, incidents = [], example = false;
  var dom = 'all', selInc = null, selNode = null, mode = 'incident', drawn = null;

  function text(s) { return document.createTextNode(s == null ? '' : String(s)); }
  function el(tag, cls, kids) { var e = document.createElement(tag); if (cls) e.className = cls; (kids || []).forEach(function (k) { e.appendChild(typeof k === 'string' ? text(k) : k); }); return e; }
  function get(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); });
  }
  function toast(msg) { $('toast').textContent = msg; }
  function fmt(n, d) { return n == null ? '-' : Number(n).toLocaleString('en', { maximumFractionDigits: d == null ? 1 : d }); }
  function segText(s) { var k = Object.keys(s || {}); return k.length ? k.map(function (x) { return s[x]; }).join(' x ') : 'all'; }
  function svg(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  // ----------------------------------------------------------- domains
  function domainOf(metric) { return domOf[metric] || 'other'; }
  function domainLabel(id) { if (id === 'all') return 'All domains'; var d = domains.filter(function (x) { return x.id === id; })[0]; return d ? d.label : 'Other'; }
  function incidentNodes(i) {
    var s = {}; s[i.metric] = true;
    (i.contributions || []).forEach(function (c) { s[c.node] = true; });
    return Object.keys(s);
  }
  function touches(i, d) { return d === 'all' || incidentNodes(i).some(function (m) { return domainOf(m) === d; }); }
  function inScope() { return incidents.filter(function (i) { return touches(i, dom); }); }
  function liveCount(d) { return incidents.filter(function (i) { return i.status !== 'resolved' && touches(i, d); }).length; }

  function renderChips() {
    var nav = $('domains'); nav.textContent = '';
    var list = [{ id: 'all', label: 'All' }].concat(domains);
    if (graph && graph.nodes.some(function (n) { return n.kind === 'metric' && !domOf[n.id]; })) list.push({ id: 'other', label: 'Other' });
    list.forEach(function (d) {
      var n = liveCount(d.id);
      var b = el('button', 'chip' + (d.id === dom ? ' on' : ''), [d.label].concat(n ? [el('span', 'n', [String(n)])] : []));
      b.setAttribute('aria-pressed', d.id === dom ? 'true' : 'false');
      b.onclick = function () { dom = d.id; selNode = null; mode = 'incident'; var s = inScope(); selInc = s.length ? s[0].id : null; renderAll(); };
      nav.appendChild(b);
    });
  }

  // ------------------------------------------------------------- graph
  function filterTree(n) {
    if (dom === 'all') return n;
    var kids = (n.children || []).map(filterTree).filter(Boolean);
    if (domainOf(n.metric) === dom || kids.length) return { metric: n.metric, role: n.role, repeated: n.repeated, children: kids };
    return null;
  }
  function layout(root) {
    var nodes = [], edges = [], leaf = 0, DX = 180, DY = 36;
    (function walk(n, depth, parent) {
      var item = { n: n, x: depth * DX + 80, y: 0 }, ys = [];
      (n.children || []).forEach(function (c) { ys.push(walk(c, depth + 1, item).y); });
      item.y = ys.length ? (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2 : (leaf++) * DY + 24;
      nodes.push(item); if (parent) edges.push([parent, item]);
      return item;
    })(root, 0, null);
    return { nodes: nodes, edges: edges, w: Math.max.apply(null, nodes.map(function (i) { return i.x; })) + 90, h: leaf * DY + 30 };
  }
  function health() {
    var h = {}, rank = { open: 3, ongoing: 2, resolved: 1 };
    incidents.forEach(function (i) {
      var st = i.status || 'open';
      incidentNodes(i).forEach(function (m) { if (!h[m] || rank[st] > rank[h[m]]) h[m] = st; });
    });
    return h;
  }
  function drawGraph() {
    $('graph-title').textContent = 'Metric graph: ' + domainLabel(dom);
    var g = $('g'); g.textContent = '';
    drawn = { edges: [], nodes: [] };
    var root = graph && graph.trees && graph.trees.length ? filterTree(graph.trees[0]) : null;
    if (!root) { $('graphwrap').appendChild(el('div', 'empty', ['No formula tree for this domain.'])); renderExtra(null); return; }
    var L = layout(root);
    g.setAttribute('viewBox', '0 0 ' + L.w + ' ' + L.h); g.style.width = '100%'; g.style.height = 'auto';
    var ge = svg('g', {}, g), gn = svg('g', {}, g), shown = {};
    L.edges.forEach(function (pair) {
      var a = pair[0], b = pair[1], x1 = a.x + 75, x2 = b.x - 75, c = (x2 - x1) / 2;
      var p = svg('path', { d: 'M' + x1 + ',' + a.y + ' C' + (x1 + c) + ',' + a.y + ' ' + (x2 - c) + ',' + b.y + ' ' + x2 + ',' + b.y, 'class': 'edge' }, ge);
      drawn.edges.push({ el: p, from: a.n.metric, to: b.n.metric });
    });
    L.nodes.forEach(function (i) {
      shown[i.n.metric] = true;
      var gr = svg('g', { 'class': 'node' + (i.n.repeated ? ' repeated' : ''), tabindex: 0, role: 'button', 'aria-label': i.n.metric, transform: 'translate(' + (i.x - 75) + ',' + (i.y - 13) + ')' }, gn);
      svg('rect', { width: 150, height: 26, rx: 6 }, gr);
      var t = svg('text', { x: 75, y: 17 }, gr); t.textContent = i.n.metric;
      var pick = function () { selNode = i.n.metric; mode = 'node'; renderDetail(); applyStyles(); };
      gr.addEventListener('click', pick);
      gr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      drawn.nodes.push({ el: gr, metric: i.n.metric });
    });
    renderExtra(shown);
    applyStyles();
  }
  function renderExtra(shown) {
    var x = $('extra'); x.textContent = '';
    if (dom === 'all' || !graph) return;
    var rest = (domains.filter(function (d) { return d.id === dom; })[0] || { metrics: [] }).metrics;
    if (dom === 'other') rest = graph.nodes.filter(function (n) { return n.kind === 'metric' && !domOf[n.id]; }).map(function (n) { return n.id; });
    rest = rest.filter(function (m) { return !(shown && shown[m]) && meta[m]; });
    if (!rest.length) return;
    x.appendChild(text('Also in this domain, not on the formula tree: '));
    rest.forEach(function (m) { var b = el('button', null, [m]); b.onclick = function () { selNode = m; mode = 'node'; renderDetail(); applyStyles(); }; x.appendChild(b); });
  }
  function applyStyles() {
    if (!drawn) return;
    var h = health(), inc = incidents.filter(function (i) { return i.id === selInc; })[0], on = {};
    if (inc && mode === 'incident') {
      on[inc.metric] = true;
      var kids = {};
      drawn.edges.forEach(function (e) { (kids[e.from] = kids[e.from] || []).push(e.to); });
      var path = function (from, target, seen) {
        if (from === target) return [from];
        if (seen[from]) return null; seen[from] = true;
        var ks = kids[from] || [];
        for (var k = 0; k < ks.length; k++) { var r = path(ks[k], target, seen); if (r) return [from].concat(r); }
        return null;
      };
      (inc.contributions || []).forEach(function (c) { on[c.node] = true; (path(inc.metric, c.node, {}) || []).forEach(function (m) { on[m] = true; }); });
    }
    $('g').classList.toggle('dim', Object.keys(on).length > 0);
    drawn.nodes.forEach(function (n) {
      var c = n.el.classList;
      ['h-open', 'h-ongoing', 'h-resolved'].forEach(function (k) { c.remove(k); });
      if (h[n.metric]) c.add('h-' + h[n.metric]);
      c.toggle('on', !!on[n.metric]);
      c.toggle('picked', mode === 'node' && selNode === n.metric);
      c.toggle('context', dom !== 'all' && domainOf(n.metric) !== dom);
    });
    drawn.edges.forEach(function (e) { e.el.classList.toggle('on', !!(on[e.from] && on[e.to])); });
  }

  // --------------------------------------------------------- right side
  function renderFeed() {
    $('feed-title').textContent = 'Incidents' + (dom === 'all' ? '' : ' in ' + domainLabel(dom));
    var f = $('feed'); f.textContent = '';
    var list = inScope();
    if (!list.length) { f.appendChild(el('div', 'empty', [dom === 'all' ? 'No incidents yet. The monitor is watching.' : 'No incident touches this domain.'])); return; }
    list.forEach(function (i) {
      var row = el('div', 'inc' + (i.id === selInc && mode === 'incident' ? ' sel' : ''), [
        el('span', 'pill ' + (i.status || 'open'), [i.status || 'open']),
        el('span', null, [el('span', 't', [i.metric + ' ' + (i.change && i.change.delta_pct != null ? fmt(i.change.delta_pct) + '%' : '')]),
                          el('div', 'm', [segText(i.segment) + ', first seen ' + (i.first_seen || '').replace('T', ' ').replace(':00Z', '').replace(/-/g, '\u2011')])]),
        el('span', 'm', [i.id])]);
      row.tabIndex = 0;
      var pick = function () { selInc = i.id; mode = 'incident'; renderFeed(); renderDetail(); applyStyles(); };
      row.addEventListener('click', pick); row.addEventListener('keydown', function (e) { if (e.key === 'Enter') pick(); });
      f.appendChild(row);
    });
  }
  function section(title, kids) { var d = el('div', null, [el('h3', null, [title])]); kids.forEach(function (k) { d.appendChild(k); }); return d; }
  function kv(pairs) { var k = el('div', 'kv'); pairs.forEach(function (p) { k.appendChild(el('span', null, [p[0]])); k.appendChild(el('span', null, [p[1]])); }); return k; }

  function renderNode(d) {
    var m = meta[selNode] || {};
    $('detail-title').textContent = 'Metric: ' + selNode;
    var pairs = [['Domain', domainLabel(domainOf(selNode))], ['Unit', m.unit || '-'], ['Direction', m.direction || '-']];
    if (m.formula) pairs.push(['Formula', m.formula]);
    if (m.decomposition) pairs.push(['Made of', m.decomposition]);
    if (m.column) pairs.push(['Column', m.column]);
    if ((m.systems || []).length) pairs.push(['Systems', m.systems.join(', ')]);
    if (m.source) pairs.push(['Data source', m.source]);
    pairs.push(['Dimensions', (m.dimensions || []).join(', ') || '-']);
    d.appendChild(section('About', [el('div', null, [m.description || 'No description.']), kv(pairs)]));
    var inc = incidents.filter(function (i) { return incidentNodes(i).indexOf(selNode) >= 0; });
    var box = inc.length ? inc.map(function (i) {
      var b = el('button', null, [i.id + ' ' + i.metric + ' (' + (i.status || 'open') + ')']);
      b.style.margin = '2px 6px 2px 0'; b.onclick = function () { selInc = i.id; mode = 'incident'; renderFeed(); renderDetail(); applyStyles(); }; return b;
    }) : [el('div', 'empty', ['No incident involves this metric.'])];
    d.appendChild(section('Incidents involving it', box));
  }
  function renderIncident(d, i) {
    $('detail-title').textContent = 'Report: ' + i.id;
    var ch = i.change || {};
    d.appendChild(section('What changed', [kv([['Metric', i.metric], ['Segment', segText(i.segment)], ['Observed', fmt(ch.observed)], ['Expected', fmt(ch.expected)],
      ['Change', ch.delta_pct != null ? fmt(ch.delta_pct) + '% (z ' + fmt(ch.z) + ')' : '-']])]));
    var imp = i.impact || {}, ik = Object.keys(imp).map(function (k) { return [k, fmt(imp[k], 0)]; });
    if (ik.length) d.appendChild(section('Business impact', [kv(ik)]));
    var cs = (i.contributions || []).map(function (c) {
      var bar = el('div', 'bar'), b = el('i'); b.style.width = Math.max(0, Math.min(100, (c.share_of_delta || 0) * 100)) + '%'; bar.appendChild(b);
      return el('div', null, [el('div', null, [c.node + ': ' + fmt((c.share_of_delta || 0) * 100, 0) + '% of the change (' + fmt(c.observed, 2) + ' vs ' + fmt(c.expected, 2) + ')']), bar]);
    });
    if (cs.length) d.appendChild(section('Where along the graph', cs));
    var hs = (i.hypotheses || []).map(function (h) {
      return el('div', 'hyp', [el('div', null, [el('span', 'pill ' + h.status, [h.status]), ' ' + h.cause]), el('ul', null, (h.evidence || []).map(function (e) { return el('li', null, [e]); }))]);
    });
    if (hs.length) d.appendChild(section('Hypotheses', hs));
    var tr = (i.trail || []).map(function (s) { return el('li', null, [s.action + ' ' + s.target + ': ' + s.result]); });
    if (tr.length) d.appendChild(section('Investigation trail', [el('ol', null, tr)]));
    if ((i.uncertain || []).length) d.appendChild(section('Still uncertain', [el('ul', null, i.uncertain.map(function (u) { return el('li', null, [u]); }))]));
    if (i.report) d.appendChild(section('Summary', [el('div', null, [i.report])]));
  }
  function renderDetail() {
    var d = $('detail'); d.textContent = '';
    if (mode === 'node' && selNode) { renderNode(d); return; }
    var i = incidents.filter(function (x) { return x.id === selInc; })[0];
    if (!i) { $('detail-title').textContent = 'Details'; d.appendChild(el('div', 'empty', ['Select a box in the graph or an incident.'])); return; }
    renderIncident(d, i);
  }

  function renderAll() { renderChips(); drawGraph(); renderFeed(); renderDetail(); }

  // ------------------------------------------------------------- polling
  function refresh() {
    get('/api/state').then(function (s) {
      $('clock').textContent = s.ready ? 'simulated clock ' + s.last_hour.replace('T', ' ').replace(':00:00Z', ':00 UTC') : s.error;
      fillEnd((s.injected || []).filter(function (i) { return i.active; }));
    }).catch(function () { $('clock').textContent = 'server not reachable'; });
    get('/api/incidents').then(function (r) {
      var before = JSON.stringify(incidents.map(function (i) { return [i.id, i.status, i.last_seen]; }));
      incidents = r.incidents; example = r.example;
      $('exbadge').textContent = '';
      if (example) $('exbadge').appendChild(el('span', 'pill example', ['showing the contract example, no live incident yet']));
      if (!selInc && incidents.length) selInc = incidents[0].id;
      if (before !== JSON.stringify(incidents.map(function (i) { return [i.id, i.status, i.last_seen]; }))) { renderChips(); renderFeed(); renderDetail(); applyStyles(); }
    }).catch(function () {});
  }

  // ------------------------------------------------------------- controls
  function fill(id, values) { var s = $(id); values.forEach(function (v) { var o = document.createElement('option'); o.value = v; o.textContent = v; s.appendChild(o); }); }
  var KINDS = [
    ['payment_failure', 'Payment failure', ['country', 'platform']],
    ['stockout_surge', 'Stockouts', ['category']],
    ['search_regression', 'Search regression', ['country']],
    ['ad_budget_exhausted', 'Ad budget gone early', ['country']]];
  KINDS.forEach(function (k) { var o = document.createElement('option'); o.value = k[0]; o.textContent = k[1]; $('f-kind').appendChild(o); });
  fill('f-country', ['DE', 'FR', 'ES', 'PL']); fill('f-platform', ['Android', 'iOS', 'Web']); fill('f-category', ['electronics', 'fashion', 'home', 'beauty', 'sports']);
  fill('pr-country', ['FR', 'DE', 'ES', 'PL']); fill('dd-source', ['payments', 'orders', 'traffic', 'search', 'recommendations', 'ads', 'inventory']);
  function showParams() {
    var need = KINDS.filter(function (k) { return k[0] === $('f-kind').value; })[0][2];
    ['country', 'platform', 'category'].forEach(function (p) { $('f-' + p).hidden = need.indexOf(p) < 0; });
  }
  $('f-kind').onchange = showParams; showParams();
  // injections that are still in effect, so a demo can end one (the rollback)
  var endKey = '';
  function fillEnd(list) {
    var key = JSON.stringify(list.map(function (i) { return i.id; }));
    $('end-grp').hidden = !list.length;
    if (key === endKey) return;
    endKey = key;
    var sel = $('end-select'), keep = sel.value;
    sel.textContent = '';
    list.forEach(function (i) {
      var where = ['country', 'platform', 'category', 'source'].map(function (d) { return i.scope[d]; }).filter(Boolean).join(' ');
      var o = document.createElement('option'); o.value = i.id;
      o.textContent = i.kind + ' ' + where + ' from ' + (i.scope.start || '').replace('T', ' ').replace(':00:00Z', ':00').slice(5);
      sel.appendChild(o);
    });
    if (keep) sel.value = keep;
  }
  $('end-go').onclick = function () {
    var id = parseInt($('end-select').value, 10);
    if (!id) return;
    toast('Ending...');
    post('/api/end', { id: id }).then(function (r) { toast('Ended from ' + r.ended_from.replace('T', ' ').replace(':00:00Z', ':00 UTC')); refresh(); })
      .catch(function (e) { toast('Failed: ' + e.message); });
  };
  function act(body, label) {
    toast(label + '...');
    post('/api/inject', body).then(function (r) { toast(label + ' from ' + r.start.replace('T', ' ').replace(':00:00Z', ':00 UTC')); refresh(); })
      .catch(function (e) { toast('Failed: ' + e.message); });
  }
  $('f-go').onclick = function () {
    var kind = $('f-kind').value, label = KINDS.filter(function (k) { return k[0] === kind; })[0][1];
    act({ kind: kind, country: $('f-country').value, platform: $('f-platform').value, category: $('f-category').value, severity: 0.4, hours: 12, when: 'now' }, label + ' injected');
  };
  $('pr-go').onclick = function () { act({ kind: 'promo', country: $('pr-country').value, hours: 12, when: 'now' }, 'Promo started'); };
  $('dd-go').onclick = function () { act({ kind: 'data_delay', source: $('dd-source').value, hours: 3, delay_hours: 2, when: 'now' }, 'Late data scheduled'); };
  $('nm-go').onclick = function () {
    var y = 'name: refund_rate\ndescription: Share of orders refunded\nformula: refunds / orders\nsql: >\n  SELECT ts, country, platform, category, channel,\n         SUM(refunds) * 1.0 / NULLIF(SUM(orders), 0) AS value\n  FROM facts_hourly GROUP BY ts, country, platform, category, channel\ndimensions: [country, platform, category, channel]\nunit: ratio\n';
    post('/api/metric', { yaml_text: y }).then(function (r) { toast('Metric handed to the monitor: ' + r.saved); }).catch(function (e) { toast('Failed: ' + e.message); });
  };

  function setTop() { document.documentElement.style.setProperty('--top-h', document.querySelector('.sticky-top').offsetHeight + 'px'); }
  setTop(); window.addEventListener('resize', setTop); if (document.fonts && document.fonts.ready) document.fonts.ready.then(setTop);

  Promise.all([get('/api/graph'), get('/api/domains'), get('/api/incidents')]).then(function (r) {
    graph = r[0]; domains = r[1]; incidents = r[2].incidents; example = r[2].example;
    graph.nodes.forEach(function (n) { if (n.kind === 'metric') meta[n.id] = n; });
    domains.forEach(function (d) { d.metrics.forEach(function (m) { domOf[m] = d.id; }); });
    if (example) $('exbadge').appendChild(el('span', 'pill example', ['showing the contract example, no live incident yet']));
    if (incidents.length) selInc = incidents[0].id;
    renderAll(); setTop();
    refresh(); setInterval(refresh, 2000);
  }).catch(function (e) { $('graphwrap').textContent = 'Could not load the graph: ' + e.message; });
})();
</script>
</body>
</html>
